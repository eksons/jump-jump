<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>跳一跳 · JUMP</title>
<meta name="description" content="按住蓄力，松手起跳 —— 一个极简等距风格的跳一跳小游戏">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#f2a541;
    --ink:#e9ecf5;
    --ink-dim:rgba(233,236,245,.55);
    --bg:#141728;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:'Space Grotesk',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}

  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 28px}
  .brand{letter-spacing:.32em;font-size:13px;font-weight:500;color:var(--ink-dim);text-transform:uppercase}
  .brand b{display:block;color:var(--ink);font-size:20px;letter-spacing:.5em;font-weight:700;margin-bottom:4px}
  .score{font-size:64px;font-weight:700;line-height:1;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.35);transition:transform .12s}
  .score.bump{transform:scale(1.18)}
  .best{text-align:right;font-size:13px;color:var(--ink-dim);letter-spacing:.18em;text-transform:uppercase}
  .best span{display:block;font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.05em;margin-top:2px}

  .hint{align-self:center;margin-bottom:34px;font-size:14px;letter-spacing:.28em;color:var(--ink-dim);transition:opacity .4s;text-transform:uppercase}
  .hint.hide{opacity:0}

  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 40%,rgba(20,23,40,.25),rgba(12,14,26,.78));backdrop-filter:blur(2px);transition:opacity .45s,visibility .45s}
  .overlay.hidden{opacity:0;visibility:hidden}
  .overlay h1{font-size:clamp(44px,9vw,76px);font-weight:700;letter-spacing:.42em;text-indent:.42em;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .overlay p{font-size:15px;letter-spacing:.3em;color:var(--ink-dim);animation:rise .7s .12s cubic-bezier(.2,.8,.2,1) both}
  .overlay .final{font-size:88px;font-weight:700;color:var(--accent);line-height:1;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .overlay .label{font-size:13px;letter-spacing:.34em;color:var(--ink-dim);text-transform:uppercase}
  .overlay .newbest{font-size:14px;letter-spacing:.2em;color:var(--accent);min-height:20px}
  button{pointer-events:auto;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.34em;text-indent:.34em;color:#1a1305;background:var(--accent);border:none;border-radius:999px;padding:16px 44px;cursor:pointer;margin-top:14px;box-shadow:0 10px 30px rgba(242,165,65,.35);transition:transform .18s,box-shadow .18s;animation:rise .7s .22s cubic-bezier(.2,.8,.2,1) both}
  button:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(242,165,65,.5)}
  button:active{transform:translateY(0) scale(.97)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.28);box-shadow:none;font-weight:500}
  button.ghost:hover{background:rgba(255,255,255,.08);box-shadow:none}
  button.mini{font-size:12px;padding:9px 18px;letter-spacing:.22em;margin-top:12px;animation:none;pointer-events:auto;position:relative;z-index:60}
  button:disabled{opacity:.45;cursor:default;transform:none}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  input#nameInput{pointer-events:auto;font-family:inherit;font-size:16px;text-align:center;letter-spacing:.1em;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:12px 22px;outline:none;width:min(260px,70vw);animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both}
  input#nameInput:focus{border-color:var(--accent)}
  .board{list-style:none;width:min(380px,86vw);max-height:52vh;overflow:auto;animation:rise .6s .1s cubic-bezier(.2,.8,.2,1) both}
  .board li{display:flex;align-items:center;gap:14px;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px}
  .board li i{font-style:normal;width:26px;text-align:center;color:var(--ink-dim);font-weight:700}
  .board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board li b{font-size:18px}
  .board li:first-child i,.board li:first-child b{color:var(--accent)}
  .board li.empty{justify-content:center;color:var(--ink-dim);border:none;font-size:14px;letter-spacing:.2em}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="top">
    <div class="brand"><b>跳一跳</b>JUMP · JUMP</div>
    <div class="score" id="score">0</div>
    <div class="best">最高纪录<span id="best">0</span><button class="ghost mini" id="boardBtn">排行榜</button></div>
  </div>
  <div class="hint" id="hint">按住蓄力 · 松手起跳</div>
</div>

<div class="overlay" id="startOverlay">
  <h1>跳一跳</h1>
  <p>按住屏幕蓄力 · 松开起跳 · 落在中心有惊喜</p>
  <button id="startBtn">开始游戏</button>
</div>

<div class="overlay hidden" id="overOverlay">
  <div class="label">本局得分</div>
  <div class="final" id="finalScore">0</div>
  <div class="newbest" id="newBest"></div>
  <input id="nameInput" maxlength="10" placeholder="你的昵称" autocomplete="off">
  <div class="row">
    <button class="ghost" id="saveBtn">保存上榜</button>
    <button id="retryBtn">再来一局</button>
  </div>
</div>

<div class="overlay hidden" id="boardOverlay">
  <div class="label">排行榜 · TOP 10</div>
  <ol class="board" id="boardList"></ol>
  <button class="ghost" id="closeBoardBtn">关闭</button>
</div>

<script>
(() => {
'use strict';
/* =====================================================================
 * 结构约定（新增功能请遵循）：
 *  CFG   —— 全部可调参数，按领域分组，唯一调参入口
 *  ST    —— 游戏状态枚举，状态机：ready→idle⇄charge→flight→(idle|fall→over)
 *  G     —— 全部运行时可变状态，resetGame() 一处初始化，禁止新增裸全局变量
 *  el    —— DOM 缓存；store —— localStorage 安全读写；sXxx —— 音效
 *  update(dt) 只改状态，draw() 只读状态，二者不交叉
 * ===================================================================== */

/* ================= 配置（唯一调参入口） ================= */
const CFG = {
  world:   { palette:['#8a9ab5','#c9a87c','#8fae9a','#a98fb0'], startSize:50,
             size:[30,44], gap:[130,190], height:[46,92], ahead:2, keepAfterPrune:3, pruneAt:6 },
  charge:  { max:1.15, squash:.32, squashEase:18 },
  jump:    { durBase:.5, durPow:.5, rangeBase:20, rangePow:260, peakBase:60, peakPow:140, stretch:.18, stretchEase:12 },
  land:    { tolerance:.92, perfectMin:8, perfectRatio:.26 },
  score:   { base:1, perfectBonus:2 },
  fall:    { speed0:200, speed1:700, drift:30, overAfter:.7 },
  idleEase:{ squash:14, height:20 },
  cam:     { ease:.001, anchorY:.56 },
  fx:      { dustCount:10, dustSpeed:[30,90], dustLift:[20,70], dustG:260, dustFade:2.2,
             popRise:34, popFade:.9, shakeLand:.35, shakeNear:.15, shakeDecay:2, popTextZ:60 },
  board:   { size:10, nameMax:10 },
  storage: { best:'jump-best', name:'jump-name', board:'jump-board' }
};
const ST = { READY:'ready', IDLE:'idle', CHARGE:'charge', FLIGHT:'flight', FALL:'fall', OVER:'over' };
const TAU = Math.PI * 2;

/* ================= DOM / 存储 ================= */
const el = {};
['game','score','best','hint','startOverlay','overOverlay','boardOverlay','boardList',
 'boardBtn','closeBoardBtn','nameInput','saveBtn','retryBtn','startBtn','finalScore','newBest']
 .forEach(id => el[id] = document.getElementById(id));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ================= 基础工具 ================= */
const canvas = el.game, ctx = canvas.getContext('2d');
let W, H, DPR, SCALE;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCALE = Math.max(.72, Math.min(1.05, W / 1100));
}
addEventListener('resize', resize); resize();

const proj = (x, y, z) => [(x - y), (x + y) * .5 - z];
const cam = { x:0, y:0 };
const toScreen = (px, py) => [(px - cam.x) * SCALE + W / 2, (py - cam.y) * SCALE + H * CFG.cam.anchorY];
const P = (x, y, z) => toScreen(...proj(x, y, z));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.min(255, Math.max(0, v * f)) | 0;
  return `rgb(${c((n >> 16) & 255)},${c((n >> 8) & 255)},${c(n & 255)})`;
}

/* ================= 音效 ================= */
let AC = null;
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } return AC; }
function tone(freq, dur, type, gain, slide){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
  g.gain.setValueAtTime(gain, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
const sJump    = p => tone(240 + p * 260, .22, 'sine', .12, 520 + p * 300);
const sLand    = () => tone(120, .16, 'triangle', .18, 60);
const sPerfect = () => { tone(660, .12, 'sine', .14); setTimeout(() => tone(990, .18, 'sine', .14), 90); };
const sFall    = () => tone(300, .5, 'sawtooth', .1, 60);

/* ================= 运行时状态（唯一可变状态容器） ================= */
const G = {
  state: ST.READY, platforms: [], platIdx: 0,
  player: { x:0, y:0, z:0, sq:1 },
  score: 0, combo: 0, best: store.get(CFG.storage.best, 0), lastScore: 0,
  chargeT: 0, flight: null, fallT: 0,
  popTexts: [], particles: [], shake: 0
};

/* ================= 世界生成 ================= */
function makePlatform(x, y, s){
  const c = CFG.world.palette[(Math.random() * CFG.world.palette.length) | 0];
  return { x, y, s, h: rand(...CFG.world.height), c, pop: 0 };
}
function genNext(){
  const axis = Math.random() < .5 ? 'x' : 'y';
  const cur = G.platforms[G.platforms.length - 1];
  const d = rand(...CFG.world.gap);
  G.platforms.push(makePlatform(
    cur.x + (axis === 'x' ? d : 0), cur.y + (axis === 'y' ? d : 0), rand(...CFG.world.size)));
}
function ensureAhead(){
  while (G.platforms.length <= G.platIdx + CFG.world.ahead) genNext();
  if (G.platIdx > CFG.world.pruneAt){
    G.platforms.splice(0, G.platIdx - CFG.world.keepAfterPrune);
    G.platIdx = CFG.world.keepAfterPrune;
  }
}
const curPlat = () => G.platforms[G.platIdx];
const nxtPlat = () => G.platforms[G.platIdx + 1];
function facingDir(){
  const n = nxtPlat(), c = curPlat();
  return Math.abs(n.x - c.x) > Math.abs(n.y - c.y) ? 'x' : 'y';
}
function focusPoint(){
  const a = curPlat(), b = nxtPlat();
  return proj((a.x + b.x) / 2, (a.y + b.y) / 2, 0);
}
function resetGame(){
  Object.assign(G, {
    state: ST.IDLE, platforms: [makePlatform(0, 0, CFG.world.startSize)], platIdx: 0,
    player: { x:0, y:0, z:0, sq:1 }, score: 0, combo: 0,
    chargeT: 0, flight: null, fallT: 0, popTexts: [], particles: [], shake: 0
  });
  ensureAhead();
  const f = focusPoint(); cam.x = f[0]; cam.y = f[1];
  uiScore();
  el.hint.classList.remove('hide');
}

/* ================= UI / 结算 ================= */
function uiScore(){
  el.score.textContent = G.score;
  el.score.classList.add('bump');
  setTimeout(() => el.score.classList.remove('bump'), 140);
}
function gameOver(){
  G.state = ST.OVER;
  G.lastScore = G.score;
  const nb = G.score > G.best;
  if (nb){ G.best = G.score; store.set(CFG.storage.best, G.best); el.best.textContent = G.best; }
  el.finalScore.textContent = G.score;
  el.newBest.textContent = nb ? '★ 新纪录 NEW BEST' : '';
  el.nameInput.value = store.get(CFG.storage.name, '') || '';
  el.saveBtn.disabled = false;
  el.saveBtn.textContent = '保存上榜';
  el.overOverlay.classList.remove('hidden');
}

/* ================= 排行榜（localStorage Top10） ================= */
function loadBoard(){ const v = store.get(CFG.storage.board, []); return Array.isArray(v) ? v : []; }
function renderBoard(){
  const b = loadBoard();
  el.boardList.innerHTML = b.length
    ? b.map((r, i) => `<li><i>${i + 1}</i><span>${esc(r.name)}</span><b>${esc(r.score)}</b></li>`).join('')
    : '<li class="empty">还没有记录，先跳一局吧</li>';
}
el.boardBtn.addEventListener('click', () => { renderBoard(); el.boardOverlay.classList.remove('hidden'); });
el.closeBoardBtn.addEventListener('click', () => el.boardOverlay.classList.add('hidden'));
el.saveBtn.addEventListener('click', () => {
  if (G.lastScore <= 0) return;
  const name = (el.nameInput.value.trim() || '无名玩家').slice(0, CFG.board.nameMax);
  store.set(CFG.storage.name, name);
  const b = loadBoard();
  b.push({ name, score: G.lastScore, ts: Date.now() });
  b.sort((x, y) => y.score - x.score || x.ts - y.ts);
  const top = b.slice(0, CFG.board.size);
  store.set(CFG.storage.board, top);
  const rank = top.findIndex(r => r.name === name && r.score === G.lastScore) + 1;
  el.saveBtn.disabled = true;
  el.saveBtn.textContent = '已上榜 · 第 ' + rank + ' 名';
});

/* ================= 输入 ================= */
function pressStart(){
  if (G.state !== ST.IDLE || !el.boardOverlay.classList.contains('hidden')) return;
  G.chargeT = 0; G.state = ST.CHARGE;
  el.hint.classList.add('hide');
}
function pressEnd(){
  if (G.state !== ST.CHARGE) return;
  const p = Math.min(1, G.chargeT / CFG.charge.max);
  const axis = facingDir();
  G.flight = {
    t: 0, dur: CFG.jump.durBase + p * CFG.jump.durPow,
    sx: G.player.x, sy: G.player.y,
    dx: axis === 'x' ? 1 : 0, dy: axis === 'y' ? 1 : 0,
    range: CFG.jump.rangeBase + p * CFG.jump.rangePow,
    peak: CFG.jump.peakBase + p * CFG.jump.peakPow, power: p
  };
  G.state = ST.FLIGHT;
  sJump(p);
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); pressStart(); });
addEventListener('pointerup', pressEnd);
addEventListener('pointercancel', pressEnd);
addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat){
    if (G.state === ST.READY){ startGame(); return; }
    pressStart();
  }
});
addEventListener('keyup', e => { if (e.code === 'Space') pressEnd(); });
el.startBtn.addEventListener('click', startGame);
el.retryBtn.addEventListener('click', startGame);
function startGame(){
  audio();
  el.startOverlay.classList.add('hidden');
  el.overOverlay.classList.add('hidden');
  el.boardOverlay.classList.add('hidden');
  resetGame();
}

/* ================= 落地判定 ================= */
const onTop = (px, py, pf) =>
  Math.abs(px - pf.x) <= pf.s * CFG.land.tolerance && Math.abs(py - pf.y) <= pf.s * CFG.land.tolerance;
function landCheck(){
  const cur = curPlat(), nxt = nxtPlat();
  const lx = G.player.x, ly = G.player.y;
  let pf = null;
  if (nxt && onTop(lx, ly, nxt)) pf = nxt;
  else if (cur && onTop(lx, ly, cur)) pf = cur;
  if (!pf){ G.state = ST.FALL; G.fallT = 0; sFall(); return; }

  G.player.x = lx; G.player.y = ly; G.player.z = 0;
  dust(lx, ly, pf.c);
  G.shake = pf === nxt ? CFG.fx.shakeLand : CFG.fx.shakeNear;
  if (pf === nxt){
    G.platIdx++;
    const perfect = Math.hypot(lx - pf.x, ly - pf.y) <= Math.max(CFG.land.perfectMin, pf.s * CFG.land.perfectRatio);
    let gain = CFG.score.base, txt = '+' + gain;
    if (perfect){
      G.combo++; gain = CFG.score.perfectBonus + G.combo;
      txt = G.combo > 1 ? `PERFECT ×${G.combo}  +${gain}` : 'PERFECT +' + gain;
      sPerfect();
    } else { G.combo = 0; sLand(); }
    G.score += gain; uiScore();
    G.popTexts.push({ x: pf.x, y: pf.y, z: CFG.fx.popTextZ, t: 1, txt, col: perfect ? '#f2a541' : '#e9ecf5' });
    ensureAhead();
  } else { sLand(); G.combo = 0; }
  G.state = ST.IDLE;
}
function dust(x, y, col){
  for (let i = 0; i < CFG.fx.dustCount; i++){
    const a = Math.random() * TAU, v = rand(...CFG.fx.dustSpeed);
    G.particles.push({ x, y, z: 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vz: rand(...CFG.fx.dustLift), t: 1, col });
  }
}

/* ================= 主循环（异常兜底：单帧抛错不再杀死整个循环） ================= */
let last = performance.now(), frameErrs = 0;
function tick(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { update(dt); draw(); }
  catch(e){ if (++frameErrs < 3) console.error('[jump] frame error:', e); }
  requestAnimationFrame(tick);
}
function update(dt){
  if (G.state !== ST.OVER){
    const f = focusPoint();
    cam.x = lerp(cam.x, f[0], 1 - Math.pow(CFG.cam.ease, dt));
    cam.y = lerp(cam.y, f[1], 1 - Math.pow(CFG.cam.ease, dt));
  }
  for (const p of G.platforms) p.pop = Math.min(1, p.pop + dt * 3);

  if (G.state === ST.CHARGE){
    G.chargeT += dt;
    G.player.sq = lerp(G.player.sq, 1 - CFG.charge.squash * Math.min(1, G.chargeT / CFG.charge.max), CFG.charge.squashEase * dt);
  } else if (G.state === ST.FLIGHT){
    G.flight.t += dt;
    const u = Math.min(1, G.flight.t / G.flight.dur);
    G.player.x = G.flight.sx + G.flight.dx * G.flight.range * u;
    G.player.y = G.flight.sy + G.flight.dy * G.flight.range * u;
    G.player.z = 4 * G.flight.peak * u * (1 - u);
    G.player.sq = lerp(G.player.sq, 1 + CFG.jump.stretch * G.flight.power, CFG.jump.stretchEase * dt);
    if (u >= 1) landCheck();
  } else if (G.state === ST.FALL){
    G.fallT += dt;
    G.player.z -= (CFG.fall.speed0 + G.fallT * CFG.fall.speed1) * dt;
    G.player.x += G.flight.dx * CFG.fall.drift * dt;
    G.player.y += G.flight.dy * CFG.fall.drift * dt;
    if (G.fallT > CFG.fall.overAfter) gameOver();
  } else {
    G.player.sq = lerp(G.player.sq, 1, CFG.idleEase.squash * dt);
    G.player.z = lerp(G.player.z, 0, CFG.idleEase.height * dt);
  }
  for (const q of G.particles){
    q.t -= dt * CFG.fx.dustFade;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vz -= CFG.fx.dustG * dt; q.z = Math.max(0, q.z + q.vz * dt);
  }
  G.particles = G.particles.filter(q => q.t > 0);
  for (const s of G.popTexts){ s.t -= dt * CFG.fx.popFade; s.z += CFG.fx.popRise * dt; }
  G.popTexts = G.popTexts.filter(s => s.t > 0);
  G.shake = Math.max(0, G.shake - dt * CFG.fx.shakeDecay);
}

/* ================= 绘制（只读 G） ================= */
const stars = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random() * .5, r: rand(.6, 1.6), ph: rand(0, TAU) }));

function draw(){
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#181c33'); sky.addColorStop(.55, '#2c2a4e'); sky.addColorStop(1, '#57405f');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const tt = performance.now() / 1000;
  for (const s of stars){
    ctx.globalAlpha = .25 + .35 * Math.abs(Math.sin(tt * .8 + s.ph));
    ctx.fillStyle = '#dfe6ff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const sun = ctx.createRadialGradient(W * .78, H * .2, 8, W * .78, H * .2, 190);
  sun.addColorStop(0, 'rgba(242,165,65,.9)'); sun.addColorStop(.25, 'rgba(242,165,65,.35)'); sun.addColorStop(1, 'rgba(242,165,65,0)');
  ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(W * .78, H * .2, 190, 0, TAU); ctx.fill();

  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake * 7, rand(-1, 1) * G.shake * 5);

  // 深度排序：平台按后缘（背角 x+y-2s）计深，保证小人始终绘制在方块之上
  const items = G.platforms.map(p => ({ d: p.x + p.y - 2 * p.s, type: 'p', o: p }));
  items.push({ d: G.player.x + G.player.y + .01, type: 'u' });
  items.sort((a, b) => a.d - b.d);
  for (const it of items) it.type === 'p' ? drawPlatform(it.o) : drawPlayer();

  for (const q of G.particles){
    const [sx, sy] = P(q.x, q.y, q.z);
    ctx.globalAlpha = Math.max(0, q.t) * .7;
    ctx.fillStyle = shade(q.col, 1.3);
    ctx.beginPath(); ctx.arc(sx, sy, 2.4 * SCALE, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const s of G.popTexts){
    const [sx, sy] = P(s.x, s.y, s.z);
    ctx.globalAlpha = Math.max(0, Math.min(1, s.t * 1.6));
    ctx.fillStyle = s.col;
    ctx.font = `700 ${18 * SCALE}px 'Space Grotesk',sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(s.txt, sx, sy);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(8,9,20,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawPlatform(p){
  const e = easeOut(p.pop);
  if (e < .02) return;
  const s = p.s, h = p.h * e;
  const A = P(p.x - s, p.y - s, 0), B = P(p.x + s, p.y - s, 0);
  const C = P(p.x + s, p.y + s, 0), D = P(p.x - s, p.y + s, 0);
  const Bb = P(p.x + s, p.y - s, -h), Cb = P(p.x + s, p.y + s, -h), Db = P(p.x - s, p.y + s, -h);
  ctx.fillStyle = shade(p.c, .72); poly([B, C, Cb, Bb]);
  ctx.fillStyle = shade(p.c, .55); poly([D, C, Cb, Db]);
  ctx.fillStyle = shade(p.c, 1.08); poly([A, B, C, D]);
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineTo(C[0], C[1]); ctx.lineTo(D[0], D[1]); ctx.closePath(); ctx.stroke();
  const c1 = P(p.x, p.y, 0);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(c1[0], c1[1], 3.4 * SCALE, 1.8 * SCALE, 0, 0, TAU); ctx.fill();
  // 目标平台呼吸光环
  if (p === nxtPlat() && (G.state === ST.IDLE || G.state === ST.CHARGE)){
    const pu = .5 + .5 * Math.sin(performance.now() / 260);
    ctx.strokeStyle = `rgba(242,165,65,${.3 + .4 * pu})`;
    ctx.lineWidth = 2.5 * SCALE;
    ctx.beginPath();
    ctx.ellipse(c1[0], c1[1], (s * .5 + pu * 5) * SCALE, (s * .25 + pu * 2.5) * SCALE, 0, 0, TAU);
    ctx.stroke();
  }
}
function poly(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}

function drawPlayer(){
  const pl = G.player;
  const [bx, by] = P(pl.x, pl.y, 0);
  const [px, py] = P(pl.x, pl.y, pl.z);
  const sq = pl.sq, st = 1 / sq;
  const sh = Math.max(.12, 1 - pl.z / 160);
  ctx.fillStyle = `rgba(10,12,25,${.38 * sh})`;
  ctx.beginPath(); ctx.ellipse(bx, by, 13 * SCALE * sh, 6.5 * SCALE * sh, 0, 0, TAU); ctx.fill();

  if (G.state === ST.CHARGE){
    const p = Math.min(1, G.chargeT / CFG.charge.max);
    ctx.strokeStyle = 'rgba(242,165,65,.9)'; ctx.lineWidth = 3.5 * SCALE;
    ctx.beginPath(); ctx.arc(bx, by, 24 * SCALE, -Math.PI / 2, -Math.PI / 2 + TAU * p); ctx.stroke();
  }

  const uH = 34 * SCALE * sq, uW = 15 * SCALE * st;
  ctx.save(); ctx.translate(px, py);
  const grad = ctx.createLinearGradient(0, -uH, 0, 0);
  grad.addColorStop(0, '#ffc46b'); grad.addColorStop(1, '#e08a2a');
  ctx.fillStyle = grad;
  rr(-uW / 2, -uH + 6 * SCALE, uW, uH - 6 * SCALE, uW / 2);
  ctx.fillStyle = '#232a41';
  ctx.beginPath(); ctx.arc(0, -uH + 2 * SCALE, 8.5 * SCALE * Math.sqrt(st), 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(-uW * .18, -uH + 12 * SCALE, 2.2 * SCALE, 0, TAU); ctx.fill();
  ctx.restore();
}
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath(); ctx.fill();
}

/* ================= 启动 ================= */
el.best.textContent = G.best;
G.platforms = [makePlatform(0, 0, CFG.world.startSize)];
ensureAhead();
const f0 = focusPoint(); cam.x = f0[0]; cam.y = f0[1];
requestAnimationFrame(tick);
})();
</script>
